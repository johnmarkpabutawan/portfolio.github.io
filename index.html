<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <p>Add, edit and organize your work by category.</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add a project</h2>

      <form id="project-form">
        <input type="hidden" id="project-id" />

        <label>
          Title
          <input type="text" id="title" required />
        </label>

        <label>
          Category
          <select id="category" required>
            <option value="">Choose a category...</option>
          </select>
        </label>

        <label>
          Description
          <textarea id="description" rows="3"></textarea>
        </label>

        <label>
          Tags (comma separated)
          <input type="text" id="tags" placeholder="javascript, api" />
        </label>

        <label>
          Link
          <input type="url" id="link" placeholder="https://..." />
        </label>

        <label>
          Project Thumbnail (JPG, PNG, or WEBP)
          <input type="file" id="thumbnail" accept="image/jpeg,image/png,image/webp" />
        </label>

        <div id="thumbnail-preview" class="thumbnail-preview" hidden>
          <img id="preview-image" alt="Project thumbnail preview" />
          <button type="button" id="remove-thumbnail-btn" class="danger">Remove image</button>
        </div>

        <div class="actions">
          <button type="submit">Save project</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search title or tags..." />
      </div>

      <div id="tabs" class="tabs"></div>

      <p id="count"></p>
      <div id="project-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/dexie@4/dist/dexie.js"></script>
  <script src="app.js"></script>
</body>
